<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>跳转中… · KPL 数据台</title>
<!-- 工具箱已并入统一外壳（左侧导航），旧链接自动跳转 -->
<script>
  (function () {
    /* 旧工具页链接形如 tools.html#hero/123 → 外壳路由是 #hero/123。
       1) 视图清单必须与 shell.js 的 TOOL_IDS 一致（此前漏了 runes / patch，
          这两类链接会被静默跳到 #items）；
       2) 保留 `/param`（英雄 id、赛事 id 等），此前 split('/')[0] 直接丢弃。 */
    var raw = (location.hash || '').replace(/^#/, '');
    var view = raw.split('/')[0];
    var param = raw.split('/').slice(1).join('/');
    var tools = ['items', 'runes', 'gradient', 'hero', 'player', 'gallery', 'patch'];
    var target = tools.indexOf(view) >= 0 ? view : 'items';
    location.replace('/#' + target + (param ? '/' + encodeURIComponent(param) : ''));
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0e17; color: #8b95ad;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; font-size: 13px; }
</style>
</head>
<body>
  <div>正在打开 KPL 数据台…</div>
</body>
</html>
