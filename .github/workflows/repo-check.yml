name: repo-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: 仓库卫生检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行检查脚本
        run: python3 scripts/check-repo.py
